# Publishes the repository as-is (static files, no build) to GitHub Pages.
# JustinMassion repo copy: uses the current major versions of the Pages actions
# (deploy-pages v4 intermittently failed with "No artifacts named github-pages were found").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # The artifact is sometimes not visible to deploy-pages straight away
      # ("No artifacts named github-pages were found"), so give it a moment and retry once.
      - run: sleep 20
      - id: first
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 45
      - id: deployment
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
